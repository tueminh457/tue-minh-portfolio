    <main class="works-page">
        <section id="works">
        <div>
            <img class="works-bg" src="assets/works/works-bg.png" alt="works-bg">
        </div>

        <div class="circular-gallery" id="circularGallery">
            <div class="gallery-track">

                <div class="gallery-item">
                    <img class="cassette1" src="assets/works/cassette1/cassette1.png" alt="Project 1">
                    <span>Project 1</span>
                </div>

                <div class="gallery-item">
                    <img class="cassette2" src="assets/works/cassette2/cassette2.png" alt="Project 2">

                </div>

                <div class="gallery-item">
                    <img class="cassette3" src="assets/works/cassette3/cassette3.png" alt="Project 3">
                    <span>Project 3</span>
                </div>

                <div class="gallery-item">
                    <img class="cassette4" src="assets/works/cassette4/cassette4.png" alt="Project 4">
                    <span>Project 4</span>
                </div>

            </div>
        </div>

        <div class="cassette1-display">
            <img class="bg1" src="assets/works/cassette1/bg1.png">
            <div class="face1-carousel" id="face1Carousel">
                <div class="face1-track" id="face1Track">

                    <div class="face1-slide" data-type="video" data-src="https://www.youtube.com/embed/DM0mLPKXTm0"></div>

                    <div class="face1-slide" data-type="image">
                        <img src="assets/works/cassette1/face1-1.png" alt="Project 1 photo 1">
                    </div>

                    <div class="face1-slide" data-type="image">
                        <img src="assets/works/cassette1/face1-2.png" alt="Project 1 photo 2">
                    </div>

                    <div class="face1-slide" data-type="image">
                        <img src="assets/works/cassette1/face1-3.png" alt="Project 1 photo 3">
                    </div>

                    <div class="face1-slide" data-type="image">
                        <img src="assets/works/cassette1/face1-4.png" alt="Project 1 photo 4">
                    </div>
                    <div class="face1-slide" data-type="image">
                        <img src="assets/works/cassette1/face1-5.png" alt="Project 1 photo 5">
                    </div>
                    <div class="face1-slide" data-type="image">
                        <img src="assets/works/cassette1/face1-6.png" alt="Project 1 photo 6">
                    </div>
                    <div class="face1-slide" data-type="image">
                        <img src="assets/works/cassette1/face1-7.png" alt="Project 1 photo 7">
                    </div>
                    <div class="face1-slide" data-type="image">
                        <img src="assets/works/cassette1/face1-8.png" alt="Project 1 photo 8">
                    </div>
                </div>
            </div>
            <img class="face1" src="assets/works/cassette1/face1.png" alt="Cassette body">
            <img class="back1" src="assets/works/cassette1/back1.png">
            <img class="button1-next" src="assets/works/cassette1/button1-next.png">
            <img class="button1-play" src="assets/works/cassette1/button1-play.png">
            <img class="button1-previous" src="assets/works/cassette1/button1-previous.png">
            <img class="button1-exit" src="assets/works/cassette1/button1-exit.png">
            <a href="https://drive.google.com/file/d/1z9gNtmVbzlrGET7wfaRRF_i3U9PeqZRo/view?usp=sharing" target="_blank" rel="noopener noreferrer">
                <img class="project-detail1" src="assets/works/cassette1/project-detail1.png">
            </a>
            <img class="track1" src="assets/works/cassette1/track1.png">
            <img class="layer1" src="assets/works/cassette1/layer1.png">
