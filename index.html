<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tue minh's portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
    <nav class="navbar">
        <div class="nav-layer">
            <a href="index.html">
                <img class="button-home" src="assets/home/button-home.svg" alt="Home">
            </a>
            <a href="about.html">
                <img class="button-about" src="assets/home/button-about.png" alt="About">
            </a>
            <a href="works.html">
                <img class="button-works" src="assets/home/button-works.png" alt="Works">
            </a>
            <a href="about.html#contact">
                <img class="button-contact" src="assets/home/button-contact.png" alt="Contact">
            </a>

            <img class="nav-bg" src="assets/home/nav.png" alt="nav-bg">
        </div>
    </nav>
    </header>

    <main class="home-page">
        <section id="home">
            <div class="background-layer">
                <img class="home-background" src="assets/home/bg.png" alt="home-background">
                <div class="home-bg-button">
                    <img class="home-bg-screen" src="assets/home/bg-screen.png" alt="home-bg-screen">
                    <img class="home-bg-pink" src="assets/home/bg-pink.png" alt="home-bg-pink">
                    <img class="home-bg-button-left" src="assets/home/bg-button-left.png" alt="home-bg-button-left">
                    <img class="home-bg-button-right" src="assets/home/bg-button-right.png" alt="home-bg-button-right">
                </div>
                <img class="home-bg-creek" src="assets/home/bg-creek.png" alt="home-bg-creek">
            </div>

            <div class="speaker" id="speaker-left">
                <img class="speaker-left1" src="assets/home/speaker-left1.png" alt="speaker-left1">
                <img class="speaker-left2" src="assets/home/speaker-left2.png" alt="speaker-left2">
                <img class="speaker-left3" src="assets/home/speaker-left3.png" alt="speaker-left3">
            </div>
            <div class="speaker" id="speaker-right">
                <img class="speaker-right1" src="assets/home/speaker-right1.png" alt="speaker-right1">
                <img class="speaker-right2" src="assets/home/speaker-right2.png" alt="speaker-right2">
                <img class="speaker-right3" src="assets/home/speaker-right3.png" alt="speaker-right3">
            </div>
        </section>
    </main>

    <script src="script.js"></script>
  </body>
