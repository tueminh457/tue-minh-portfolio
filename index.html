            <div class="speaker" id="speaker-right">

                <img class="speaker-right2" src="assets/home/speaker-right2.png" alt="speaker-right2">
                <img class="speaker-right3" src="assets/home/speaker-right3.png" alt="speaker-right3">
            </div>

                <img class="title-portfolio" src="assets/home/portfolio.png" alt="title-portfolio">
                <img class="title-apple" src="assets/home/apple.png" alt="title-apple">
                <img class="title-cassette" src="assets/home/cassette.png" alt="title-cassette">
                <img class="title-circle" src="assets/home/circle.png" alt="title-circle">
                <img class="title-star1" src="assets/home/star1.png" alt="title-star1">
                <img class="title-star2" src="assets/home/star2.png" alt="title-star2">

                <p class="click-to-continue">click to continue</p>
